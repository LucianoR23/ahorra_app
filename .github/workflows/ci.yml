# CI for the Next.js app (plan 0.11 + 0.19). Runs on every push to `next` and on
# PRs into it. Third-party actions are pinned by commit SHA; Dependabot bumps them.
# Same steps as `pnpm check` locally.
name: ci

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  # By hand: writes new visual baselines (plan 1.10b) as an artifact.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: America/Argentina/Buenos_Aires
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time values for a CI build only (never deployed).
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests + coverage floors (Vitest)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Audit production dependencies (fails on high/critical)
        run: pnpm audit --prod --audit-level high

      # Dev tools (eslint, shadcn CLI, tailwind) run on our machines and in CI,
      # so their high/critical advisories fail too.
      - name: Audit all dependencies (fails on high/critical)
        run: pnpm audit --audit-level high

  # End-to-end (plan 0.21h): the real front end against the real API (branch
  # next) and a throwaway Postgres. PRs only (decided 2026-11-05). The private
  # API repo is checked out with a read-only deploy key (secret API_DEPLOY_KEY).
  # Run by hand, it only rewrites the visual baselines (plan 1.10b).
  e2e:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: America/Argentina/Buenos_Aires
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      NEXT_PUBLIC_API_URL: http://localhost:8080
      E2E_API_DIR: api
      E2E_DATABASE_URL: postgres://postgres:e2e_only_pw@localhost:5432/valuo_e2e?sslmode=disable
      VISUAL: "1"
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_PASSWORD: e2e_only_pw
          POSTGRES_DB: valuo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the API (branch next)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LucianoR23/valuo_api
          ref: next
          path: api
          ssh-key: ${{ secrets.API_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the API
        working-directory: api
        run: go build ./cmd/api

      - name: Build the app
        run: pnpm build

      - name: E2E (Playwright)
        if: github.event_name == 'pull_request'
        run: pnpm test:e2e

      # Plan 1.10a: every screen in light/dark, mobile/desktop, for review.
      # Its own run so it gets a fresh API (sign-up rate limit). Plan 1.10b:
      # each shot is compared with its baseline; a screen without one writes
      # it and passes. By hand, every baseline is rewritten.
      - name: Screenshots and visual regression (Playwright)
        run: pnpm test:screens --update-snapshots=${{ github.event_name == 'workflow_dispatch' && 'all' || 'missing' }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: test-results/screens/
          if-no-files-found: ignore
          retention-days: 14

      # Expected, actual and diff of each changed screen.
      - name: Upload visual diffs
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 14

      # Download into e2e/__screenshots__ and commit (see e2e/screens.spec.ts).
      - name: Upload visual baselines
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: e2e/__screenshots__/
          if-no-files-found: error
          retention-days: 14

  secrets:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
