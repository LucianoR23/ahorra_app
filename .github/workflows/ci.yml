# CI for the Next.js app (plan 0.11 + 0.19). Runs on every push to `next` and on
# PRs into it. Third-party actions are pinned by commit SHA; Dependabot bumps them.
# Same steps as `pnpm check` locally.
name: ci

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: America/Argentina/Buenos_Aires
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time values for a CI build only (never deployed).
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Audit production dependencies (fails on high/critical)
        run: pnpm audit --prod --audit-level high

  # End-to-end (plan 0.21h): the real front end against the real API (branch
  # next) and a throwaway Postgres. PRs only (decided 2026-11-05). The private
  # API repo is checked out with a read-only deploy key (secret API_DEPLOY_KEY).
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: America/Argentina/Buenos_Aires
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      NEXT_PUBLIC_API_URL: http://localhost:8080
      E2E_API_DIR: api
      E2E_DATABASE_URL: postgres://postgres:e2e_only_pw@localhost:5432/ahorra_e2e?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_PASSWORD: e2e_only_pw
          POSTGRES_DB: ahorra_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the API (branch next)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LucianoR23/api_go_ahorro
          ref: next
          path: api
          ssh-key: ${{ secrets.API_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the API
        working-directory: api
        run: go build ./cmd/api

      - name: Build the app
        run: pnpm build

      - name: E2E (Playwright)
        run: pnpm test:e2e

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
