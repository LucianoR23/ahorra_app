<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Modo discreto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 640px; position: relative; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.ink}}; font-family: Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 450; overflow: hidden">
<main style="flex: 1; min-height: 0; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div role="tablist" aria-label="Espacio" style="display: flex; background: {{c.s2}}; border-radius: 999px; padding: 4px">
<button role="tab" aria-selected="true" style="height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: {{c.surface}}; color: {{c.ink}}; font: inherit; font-size: 14px; font-weight: 700; box-shadow: {{c.shadow}}">Yo</button>
<button role="tab" aria-selected="false" style="height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; color: {{c.muted}}; font: inherit; font-size: 14px; font-weight: 650">Hogar</button>
</div>
<button aria-label="Mostrar montos" aria-pressed="true" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: {{c.ink}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.onp}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><path d="M2 2l20 20"></path></svg></button>
</div>

<section aria-label="Resumen del mes" style="display: flex; flex-direction: column; gap: 6px; padding: 4px 4px 0">
<p style="margin: 0; font-size: 12px; font-weight: 650; letter-spacing: 0.04em">GASTASTE EN NOVIEMBRE</p>
<p aria-label="Monto oculto" style="margin: 0; font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: 0.06em">$ ••••••</p>
<div style="display: flex; gap: 20px; margin-top: 6px">
<p style="margin: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: {{c.muted}}; font-weight: 500">Entraron</span><span aria-label="Monto oculto" style="font-size: 15px; font-weight: 650; letter-spacing: 0.06em">$ ••••••</span></p>
<p style="margin: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: {{c.muted}}; font-weight: 500">Te quedan</span><span aria-label="Monto oculto" style="font-size: 15px; font-weight: 650; letter-spacing: 0.06em">$ ••••••</span></p>
</div>
</section>

<section style="background: {{c.surface}}; border: 1px solid {{c.card}}; box-shadow: {{c.shadow}}; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 17px; font-weight: 650">Comprometido</h2>
<p style="margin: 0; font-size: 15px">Diciembre ya tiene <strong aria-label="monto oculto" style="font-weight: 700; letter-spacing: 0.06em">$ ••••••</strong> en cuotas.</p>
<div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 10px; height: 72px">
<span style="flex: 1; height: 100%; background: {{c.accent}}; border-radius: 6px"></span><span style="flex: 1; height: 78%; background: {{c.muted}}; border-radius: 6px"></span><span style="flex: 1; height: 64%; background: {{c.muted}}; border-radius: 6px"></span><span style="flex: 1; height: 40%; background: {{c.muted}}; border-radius: 6px"></span><span style="flex: 1; height: 26%; background: {{c.muted}}; border-radius: 6px"></span><span style="flex: 1; height: 12%; background: {{c.muted}}; border-radius: 6px"></span>
</div>
</section>

<ul style="list-style: none; margin: 0; padding: 0 18px; background: {{c.surface}}; border: 1px solid {{c.card}}; box-shadow: {{c.shadow}}; border-radius: 22px">
<li style="display: flex; align-items: center; gap: 12px; padding: 13px 0"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 650">Café</span><span style="font-size: 13px; color: {{c.muted}}; font-weight: 500">Comida · Visa · Hoy</span></span><span aria-label="Monto oculto" style="font-size: 15px; font-weight: 700; letter-spacing: 0.06em">$ •••</span></li>
<li style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid {{c.border}}"><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 650">Súper</span><span style="font-size: 13px; color: {{c.muted}}; font-weight: 500">Mercado Pago · Hoy</span></span><span aria-label="Monto oculto" style="font-size: 15px; font-weight: 700; letter-spacing: 0.06em">$ •••</span></li>
</ul>
</main>

<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 24px; background: {{c.ink}}; color: {{c.onp}}; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.25)">
<span style="flex: 1; font-size: 14px; font-weight: 600; line-height: 1.4">Montos ocultos en toda la app. Tocá el ojo para verlos.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'light';
const L = {bg:'#FAFAF9',surface:'#FFFFFF',s2:'#F1F1EE',border:'#E3E3DF',bs:'#868991',ink:'#111214',muted:'#5B5E66',onp:'#FFFFFF',accent:'#F2A900',ai:'#8A5A00',soft:'#FDF1D6',pos:'#0A5C44',neg:'#CC3333',negsoft:'#FBEBEB',track:'#E3E3DF',card:'transparent',shadow:'0 1px 2px rgba(17,18,20,0.06), 0 4px 16px rgba(17,18,20,0.04)',focus:'#2F5FE0'};
const D = {bg:'#0B0C0E',surface:'#141518',s2:'#1C1E22',border:'#2C2F35',bs:'#6A6E76',ink:'#F4F4F2',muted:'#A3A6AD',onp:'#111214',accent:'#F5B53F',ai:'#F5B53F',soft:'#33270D',pos:'#7CEBC0',neg:'#E55A5A',negsoft:'#3A1A1A',track:'#2C2F35',card:'#2C2F35',shadow:'none',focus:'#8AA8FF'};
return { theme: theme, c: theme === 'dark' ? D : L };
}
}
</script>
</body>
</html>
