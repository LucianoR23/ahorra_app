# gitleaks: default rules plus one exception. Uses the single [allowlist]
# table because the CI action runs gitleaks 8.24, which predates [[allowlists]].
[extend]
useDefault = true

[allowlist]
description = "brand/manifest.json holds SHA-256 hashes of the vendored brand files (generated by pnpm brand:sync), not secrets"
paths = ['''^brand/manifest\.json$''']
